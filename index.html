<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Medieval Archives — Galleries</title>
  <style>
    :root{--gap:12px;--card-bg:#fff;--muted:#6b7280}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;background:#f8fafc;color:#0f172a}
    header{padding:20px 24px;border-bottom:1px solid #e6edf3;background:#fff;display:flex;align-items:center;justify-content:space-between}
    h1{font-size:1.25rem;margin:0}
    .controls{display:flex;gap:12px;align-items:center}
    button{background:#0ea5e9;border:none;padding:8px 12px;color:white;border-radius:8px;cursor:pointer}
    .container{max-width:1100px;margin:24px auto;padding:0 16px}
    section{margin-bottom:28px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--gap)}
    .card{background:var(--card-bg);border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,0.04);border:1px solid #e6eef6}
    .card img{display:block;width:100%;height:160px;object-fit:cover}
    .meta{padding:10px 12px}
    .title{font-weight:600;margin:0;font-size:0.95rem}
    .caption{margin:6px 0 0;color:var(--muted);font-size:0.86rem}
    footer{padding:18px;text-align:center;color:var(--muted);font-size:0.9rem}
    .loader{color:var(--muted);font-size:0.95rem}
    a.attribution{color:#0ea5e9;text-decoration:none;font-size:0.86rem}
    @media (max-width:520px){ .card img{height:120px} }
  </style>
</head>
<body>
  <header>
    <h1>The Medieval Archives — Image Galleries</h1>
    <div class="controls">
      <button id="loadSiteBtn">Open archived site (ZIP)</button>
      <a class="attribution" href="https://github.com/AnnaAleeza/med" target="_blank">Repo</a>
    </div>
  </header>

  <main class="container">
    <section id="arts">
      <h2>Arts (paintings)</h2>
      <div class="grid" id="artsGrid">
        <!-- arts images inserted here -->
      </div>
    </section>

    <section id="architecture">
      <h2>Architecture</h2>
      <div class="grid" id="archGrid">
        <!-- architecture images inserted here -->
      </div>
    </section>

    <section id="people">
      <h2>People (portraits)</h2>
      <div class="grid" id="peopleGrid">
        <!-- people images inserted here -->
      </div>
    </section>

    <div id="siteArea"></div>
  </main>

  <footer>
    Images are pulled from Wikimedia Commons (public domain or Commons-licensed). Click an image to open its Commons file page.
  </footer>

  <script>
  // Categories: arrays of search strings that we'll use with the Wikimedia Commons API to find files.
  const categories = {
    arts: [
      'The Night Watch Rembrandt',
      'Arnolfini Portrait Jan van Eyck',
      'The Birth of Venus Botticelli',
      'Mona Lisa Leonardo da Vinci'
    ],
    architecture: [
      'Chartres Cathedral interior',
      'Hall of Mirrors Palace of Versailles',
      'Colosseum, Rome'
    ],
    people: [
      'Rembrandt self-portrait',
      'Van Gogh self-portrait',
      'Elizabeth I of England portrait'
    ]
  };

  const commonsApiBase = 'https://commons.wikimedia.org/w/api.php?origin=*';

  async function findFileFor(term){
    // Search File namespace (ns=6)
    const url = `${commonsApiBase}&action=query&format=json&list=search&srsearch=${encodeURIComponent(term)}&srnamespace=6&srlimit=1`;
    try{
      const r = await fetch(url);
      const j = await r.json();
      const hits = j.query && j.query.search;
      if(hits && hits.length) return hits[0].title; // e.g. 'File:...'
      return null;
    }catch(e){console.warn('search failed',term,e);return null}
  }

  async function fileInfo(title){
    const url = `${commonsApiBase}&action=query&format=json&prop=imageinfo&titles=${encodeURIComponent(title)}&iiprop=url|extmetadata`;
    const r = await fetch(url);
    const j = await r.json();
    const pages = j.query && j.query.pages;
    const pageKey = Object.keys(pages||{})[0];
    const page = pages[pageKey];
    if(page && page.imageinfo && page.imageinfo.length){
      return {info: page.imageinfo[0], title: page.title};
    }
    return null;
  }

  function makeCard(href, src, title, caption){
    const wrapper = document.createElement('div'); wrapper.className='card';
    const a = document.createElement('a'); a.href = href; a.target='_blank'; a.rel='noopener';
    const img = document.createElement('img'); img.src = src; img.alt = title || '';
    a.appendChild(img);
    const meta = document.createElement('div'); meta.className='meta';
    const t = document.createElement('div'); t.className='title'; t.textContent = title || '';
    const c = document.createElement('div'); c.className='caption'; c.innerHTML = caption || '';
    meta.appendChild(t); meta.appendChild(c);
    wrapper.appendChild(a); wrapper.appendChild(meta);
    return wrapper;
  }

  async function populateGrid(gridId, terms){
    const grid = document.getElementById(gridId);
    grid.innerHTML = '<div class="loader">Loading images…</div>';
    const results = [];
    for(const term of terms){
      const title = await findFileFor(term);
      if(!title) continue;
      const fi = await fileInfo(title);
      if(!fi || !fi.info || !fi.info.url) continue;
      const src = fi.info.url;
      const commonsPage = 'https://commons.wikimedia.org/wiki/' + encodeURIComponent(fi.title.replace(/ /g,'_'));
      const artist = (fi.info.extmetadata && fi.info.extmetadata.Artist && fi.info.extmetadata.Artist.value) || '';
      const license = (fi.info.extmetadata && fi.info.extmetadata.LicenseShortName && fi.info.extmetadata.LicenseShortName.value) || '';
      const caption = `${artist ? artist + ' · ' : ''}${license ? license : ''} <br><a class="attribution" href="${commonsPage}" target="_blank">Commons</a>`;
      results.push(makeCard(commonsPage, src, fi.title.replace(/^File:/,''), caption));
    }
    grid.innerHTML='';
    if(results.length===0) grid.innerHTML='<div class="loader">No images found for this category.</div>';
    for(const el of results) grid.appendChild(el);
  }

  // Kick off population
  (async function(){
    populateGrid('artsGrid', categories.arts);
    populateGrid('archGrid', categories.architecture);
    populateGrid('peopleGrid', categories.people);
  })();

  // --- ZIP site loader (runs only when user clicks the button) ---
  document.getElementById('loadSiteBtn').addEventListener('click', ()=>{
    loadZipSite();
  });

  async function loadZipSite(){
    const btn = document.getElementById('loadSiteBtn');
    btn.disabled = true; btn.textContent = 'Loading archived site…';
    const repoUser = 'AnnaAleeza';
    const repoName = 'med';
    const zipPath = 'The%20Medieval%20Archives%20Website.zip';
    const rawUrl = `https://raw.githubusercontent.com/${repoUser}/${repoName}/main/${zipPath}`;

    try{
      // Load JSZip dynamically
      if(typeof JSZip === 'undefined'){
        await new Promise((res,rej)=>{
          const s = document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js';
          s.onload = res; s.onerror = rej; document.head.appendChild(s);
        });
      }

      const resp = await fetch(rawUrl);
      if(!resp.ok) throw new Error('Could not download ZIP: '+resp.status);
      const ab = await resp.arrayBuffer();
      const zip = await JSZip.loadAsync(ab);

      // find index
      const files = [];
      zip.forEach((p,f)=>{ if(!f.dir) files.push(p); });
      let indexPath = files.find(p=>p.toLowerCase()==='deploy/index.html') || files.find(p=>p.toLowerCase().endsWith('/index.html')) || files.find(p=>p.toLowerCase()==='index.html');
      if(!indexPath) throw new Error('No index.html found inside ZIP');

      const html = await zip.file(indexPath).async('string');

      // prepare blobs map
      const blobMap = {};
      for(const p of files){
        try{
          const isText = /\.(html?|css|js|json|svg|txt|xml|map)$/i.test(p);
          if(isText){ const txt = await zip.file(p).async('string'); blobMap[p]=URL.createObjectURL(new Blob([txt],{type:'text/plain'})); }
          else { const abuf = await zip.file(p).async('arraybuffer'); blobMap[p]=URL.createObjectURL(new Blob([abuf])); }
        }catch(e){console.warn('blob fail',p,e)}
      }

      // create iframe and write the index HTML into it. For simplicity, we won't rewrite every link; the embedded site may work for many cases.
      const siteArea = document.getElementById('siteArea');
      siteArea.innerHTML = '';
      const iframe = document.createElement('iframe'); iframe.style.width='100%'; iframe.style.height='80vh'; iframe.style.border='0';
      siteArea.appendChild(iframe);
      const idoc = iframe.contentDocument || iframe.contentWindow.document;
      idoc.open(); idoc.write(html); idoc.close();

      btn.textContent = 'Archived site loaded';
    }catch(err){
      console.error(err);
      alert('Failed to load archived site: ' + err.message);
      btn.disabled = false; btn.textContent = 'Open archived site (ZIP)';
    }
  }
  </script>
</body>
</html>
